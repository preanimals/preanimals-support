* { box-sizing: border-box; }

main { max-width: 40rem; margin: 0 auto; }

.eyebrow { font-size: 0.6875rem; letter-spacing: 0.4em; color: var(--faint); margin: 0; }

h3 { font-size: 0.875rem; font-weight: 600; margin: 1.75rem 0 0; }
p { color: var(--muted); margin: 0.5rem 0 0; }
ul, ol { color: var(--muted); margin: 0.5rem 0 0; padding-left: 1.25rem; }
li { margin: 0.25rem 0; }
a { color: var(--accent); }
.note {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 0.875rem 1rem; margin: 1rem 0 0;
  font-size: 0.875rem; color: var(--muted);
}
nav.links { margin: 2.5rem 0 0; font-size: 0.875rem; }
nav.links a { margin-right: 1.25rem; }
footer { margin: 3.5rem 0 0; font-size: 0.75rem; color: var(--faint); }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1a17; --surface: #272320; --border: #3a342e;
    --text: #f0e9df; --muted: #b0a698; --faint: #7d746a; --accent: #f0bb8a;
